<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=news.html">
  <title>Parent Information | George &amp; Duke Institutions</title>
  <link rel="canonical" href="news.html">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: var(--space-6);
      background: var(--color-light-cream);
      font-family: var(--font-family-base);
      color: var(--color-dark-brown);
      text-align: center;
    }
    .redirect-card {
      max-width: 520px;
      padding: var(--space-8);
      background: var(--color-white);
      border: 1px solid var(--color-border-tint);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    h1 {
      font-size: var(--font-size-2xl);
      color: var(--color-primary-brown);
      margin-bottom: var(--space-3);
    }
    p {
      color: var(--color-dark-brown);
      margin-bottom: var(--space-6);
      line-height: var(--line-height-relaxed);
    }
    .btn {
      display: inline-block;
      padding: var(--space-3) var(--space-6);
      background: var(--color-primary-brown);
      color: var(--color-white);
      border-radius: var(--radius-sm);
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--color-dark-brown);
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <h1>Parent Information &amp; Updates</h1>
    <p>
      Parent announcements, term dates, and school bulletins are now centrally organized on our <strong>News &amp; Events</strong> page.
    </p>
    <a class="btn" href="news.html">Continue to News &amp; Events</a>
  </main>
</body>
</html>
